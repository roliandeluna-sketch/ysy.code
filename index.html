<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Express - Exclusive Offer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .bg-icons {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
    }
    .bg-icons svg {
      position: absolute;
      fill: none;
      stroke: #ffcc00;
      stroke-width: 1.5;
    }
    .icon-1 { top: 10%; left: 5%; width: 80px; }
    .icon-2 { top: 20%; right: 8%; width: 100px; }
    .icon-3 { bottom: 15%; left: 10%; width: 90px; }
    .icon-4 { bottom: 20%; right: 5%; width: 70px; }
    .icon-5 { top: 45%; left: 2%; width: 60px; }
    .icon-6 { top: 50%; right: 3%; width: 85px; }
    .icon-7 { top: 75%; left: 45%; width: 110px; }
    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .card {
      background: rgba(10, 10, 10, 0.9);
      border: 2px solid #7ec8e3;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow:
        0 0 15px #7ec8e3,
        0 0 30px #ffcc00,
        0 0 60px #ff9900,
        inset 0 0 20px rgba(255, 204, 0, 0.1);
      backdrop-filter: blur(5px);
    }
    h1 {
      color: #ffffff;
      font-size: 2.4em;
      margin-bottom: 10px;
      text-shadow:
        0 0 10px #ffcc00,
        0 0 20px #ff9900,
        0 0 40px #ff6600;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #7ec8e3;
      font-size: 1.2em;
      margin-bottom: 30px;
      font-weight: 600;
      text-shadow: 0 0 10px #7ec8e3;
    }
    .offer {
      background: rgba(255, 204, 0, 0.05);
      border: 2px dashed #ffcc00;
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      box-shadow:
        0 0 15px rgba(255, 204, 0, 0.4),
        inset 0 0 15px rgba(255, 204, 0, 0.1);
    }
    .offer h2 {
      color: #ffcc00;
      font-size: 2.8em;
      margin-bottom: 10px;
      text-shadow:
        0 0 10px #ffcc00,
        0 0 20px #ff9900,
        0 0 40px #ff6600;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900, 0 0 40px #ff6600; }
      50% { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff9900, 0 0 60px #ff6600; }
    }
    .offer p {
      color: #ffffff;
      font-size: 1.1em;
    }
    .usa-note {
      color: #ff6600;
      font-size: 0.95em;
      margin-top: 15px;
      font-weight: 600;
      text-shadow: 0 0 10px #ff6600;
    }
    .btn-code {
      background: transparent;
      color: #ffcc00;
      border: 2px solid #ffcc00;
      padding: 15px 40px;
      font-size: 1.3em;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 25px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow:
        0 0 15px #ffcc00,
        0 0 30px rgba(255, 153, 0, 0.5),
        inset 0 0 15px rgba(255, 204, 0, 0.1);
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
      max-width: 400px;
    }
    .btn-code:hover {
      background: rgba(255, 204, 0, 0.1);
      box-shadow:
        0 0 25px #ffcc00,
        0 0 50px #ff9900,
        inset 0 0 20px rgba(255, 204, 0, 0.2);
      transform: scale(1.03);
    }
    .btn-code.revealed {
      background: #7ec8e3;
      color: #0a0a0a;
      border-color: #7ec8e3;
      letter-spacing: 3px;
      font-size: 1.8em;
      box-shadow:
        0 0 25px #7ec8e3,
        0 0 50px #7ec8e3;
    }
    .ad-space {
      margin: 30px 0;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed rgba(126, 200, 227, 0.3);
      border-radius: 10px;
      color: rgba(126, 200, 227, 0.5);
      font-size: 0.9em;
    }
    footer {
      margin-top: 30px;
      color: #7ec8e3;
      font-size: 0.85em;
      text-shadow: 0 0 10px #7ec8e3;
    }
  </style>
</head>
<body>

  <div class="bg-icons">
    <svg class="icon-1" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    <svg class="icon-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2" ry="2"></rect>
      <line x1="2" y1="20" x2="22" y2="20"></line>
    </svg>
    <svg class="icon-3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12" y2="18"></line>
    </svg>
    <svg class="icon-4" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12" y2="18"></line>
    </svg>
    <svg class="icon-5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
      <line x1="6" y1="10" x2="6" y2="10"></line>
      <line x1="10" y1="10" x2="10" y2="10"></line>
      <line x1="14" y1="10" x2="14" y2="10"></line>
      <line x1="18" y1="10" x2="18" y2="10"></line>
    </svg>
    <svg class="icon-6" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="3" width="12" height="18" rx="6" ry="6"></rect>
      <line x1="12" y1="7" x2="12" y2="11"></line>
    </svg>
    <svg class="icon-7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
  </div>

  <div class="container">
    <div class="card">
      <h1>Freelance Express</h1>
      <p class="subtitle">The fastest way to connect with clients</p>

      <!-- A-ADS AD UNIT (ARRIBA) -->
      <div style="margin: 30px 0;">
        <!-- BEGIN AADS AD UNIT 2456269 -->
        <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
          <iframe data-aa='2456269' src='//acceptable.a-ads.com/2456269/?size=Adaptive'
                  style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>

      <div class="offer">
        <h2>50% OFF</h2>
        <p>On all paid plans with AI integration</p>
        <p>Improve your experience from day one</p>
      </div>

      <p style="color: #ffffff; font-size: 1.1em; margin-bottom: 10px;">
        Tap the button to reveal your discount code:
      </p>

      <button class="btn-code" id="codeBtn" onclick="revealCode()">
        Open Discount Code
      </button>

      <p class="usa-note">⚠️ Offer valid for United States users only</p>

      <!-- A-ADS AD UNIT (ABAJO) -->
      <div style="margin-top: 40px;">
        <!-- BEGIN AADS AD UNIT 2456269 -->
        <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
          <iframe data-aa='2456269' src='//acceptable.a-ads.com/2456269/?size=Adaptive'
                  style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>
        <!-- END AADS AD UNIT 2456269 -->
      </div>
    </div>

    <footer>
      <p>© 2026 YSY Company. All rights reserved.</p>
    </footer>
  </div>

  <script>
    function revealCode() {
      const btn = document.getElementById('codeBtn');
      if (!btn.classList.contains('revealed')) {
        btn.textContent = 'FREELANCE50';
        btn.classList.add('revealed');
        navigator.clipboard.writeText('FREELANCE50').then(() => {
          console.log('Code copied to clipboard');
        }).catch(() => {});
      }
    }
  </script>
</body>
</html>
